name: freegi

description: "Freegi Grocery Delivery App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/freegi_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00AFA8"
  adaptive_icon_foreground: "assets/icon/freegi_icon.png"